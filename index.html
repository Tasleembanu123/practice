<!DOCTYPE html>
<html>
<head>
    <title>Patient Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body style="background-color: lightblue;">

<form>
    <h2>Patient Form</h2>

    <label>Name</label>
    <input type="text">
<br><br>
    <label>Age</label>
    <input type="number">
<br><br>
    <label>Gender</label>
    <select>
        <option>Male</option>
        <option>Female</option>
    </select>
<br><br>
    <label>Phone</label>
    <input type="text">
<br><br>
    <label>Disease</label>
    <input type="text">

    <button>Submit</button>
</form>

</body>
</html>
<head>

    <title>patient form</title>

    <style>

        body {
            background-color: lightblue;
            font-family: Arial;
        }

        form {

    </style>
